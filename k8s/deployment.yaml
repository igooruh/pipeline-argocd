kind: Deployment
apiVersion: apps/v1
metadata:
  name: application-simple-gitops
  namespace: openshift-image-registry
  labels:
    app: application-simple-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: application-simple-gitops
  template:
    metadata:
      labels:
        app: application-simple-gitops
    spec:
      containers:
        - name: application-simple-gitops
          image: default-route-openshift-image-registry.apps.itz-vaz6gq.infra01-lb.dal14.techzone.ibm.com/openshift-image-registry/application-simple-gitops
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: RUN_TYPE
              value: cpu
            - name: CPU_PERCENT
              value: '95'
          resources:
            limits:
              cpu: 700m
              memory: 30Gi
            requests:
              cpu: 100m
              memory: 10Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: deployer-dockercfg-pwtdb
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600